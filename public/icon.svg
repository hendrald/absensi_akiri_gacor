<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Clock Circle -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
  <!-- Center Dot -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
  <!-- Clock Hands pointing to 9 hours mark -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  <line x1="256" y1="256" x2="165" y2="256" stroke="#fbbf24" stroke-width="26" stroke-linecap="round" />
  <!-- 9h Badge -->
  <rect x="290" y="270" width="130" height="70" rx="35" fill="#10b981" />
  <text x="355" y="318" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">9h</text>
</svg>

